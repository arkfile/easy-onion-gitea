name: ci

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck and shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          curl -fsSL -o /tmp/shfmt https://github.com/mvdan/sh/releases/download/v3.11.0/shfmt_v3.11.0_linux_amd64
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
      - name: ShellCheck
        run: ./tests/shellcheck.sh
      - name: shfmt check
        run: |
          shfmt -d -s -i 2 -ci \
            install.sh install-client.sh uninstall.sh \
            bin/eog-admin bin/eogit \
            scripts/*.sh tests/*.sh
      - name: Static smoke
        run: ./tests/smoke-static.sh
